name: CI
on:
  push:
    branches: ["docs/project-blueprint"]
    paths-ignore:
      - "package-lock.json"
  pull_request:
    branches: ["docs/project-blueprint"]
concurrency:
  group: waste-management-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waste_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d waste_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waste_management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies and generate lockfile
        run: npm install
      - name: Commit generated lockfile on the project branch
        if: github.event_name == 'push'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add reproducible npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify clean lockfile installation
        if: github.event_name == 'push'
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Apply PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f database/001_schema.sql
      - name: Verify PostgreSQL schema
        run: npm run db:verify
      - name: Run database integrity smoke tests
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f database/002_smoke_test.sql
      - run: npm run build
